<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蝋燭人狼 デモ</title>
<style>
  :root { --bg: #0b0c10; --ink: #e8e1cf; --muted: #9a958a; --line: #2a2c33; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Hiragino Sans', system-ui, sans-serif; }
  .wrap { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header b { font-family: 'Hiragino Mincho ProN', serif; font-size: 16px; letter-spacing: .06em; }
  header span { color: var(--muted); font-size: 12.5px; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 14px 16px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: .08em; }
  .gm { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #000; }
  .phone { width: 390px; height: 844px; border: 10px solid #1a1b20; border-radius: 38px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px #33353d, 0 20px 50px #000; transform-origin: top center; }
  .phone iframe { width: 100%; height: 100%; border: 0; }
  .ph-wrap { height: calc(100vh - 90px); display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
  <header><b>蝋燭人狼 ── デモ</b><span>左＝全体（進行役の画面・役職表示つき）／右＝CPU アオイのスマホ。左の「ゲーム開始」を押すと始まります（音もそこで鳴り始めます）。</span></header>
  <div class="stage">
    <div class="pane"><div class="label">全体の動き</div><iframe id="gm" class="gm" src="index.html?t=bc&demo=1"></iframe></div>
    <div class="pane"><div class="label">CPU アオイのスマホ</div><div class="ph-wrap"><div class="phone" id="phone"><iframe id="pl"></iframe></div></div></div>
  </div>
</div>
<script>
  const fit = () => { const ph = document.getElementById('phone'); const h = window.innerHeight - 100; const s = Math.min(1, h / 864, (window.innerWidth * 0.42) / 410); ph.style.transform = `scale(${s})`; ph.parentElement.style.width = (410 * s) + 'px'; };
  addEventListener('resize', fit); fit();
  addEventListener('message', (e) => {
    if (e.data && e.data.demoRoom) document.getElementById('pl').src = `index.html?r=${e.data.demoRoom}&t=bc&auto=1&mute=1&name=${encodeURIComponent('CPU アオイ')}`;
  });
</script>
</body>
</html>
